name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,real]'
      - run: python -m ruff check .
      - run: python -m mypy --strict src pilot external_challenge
      - run: >-
          python -m pytest
          --cov=erasemap --cov=external_challenge --cov=pilot
          --cov-report=term-missing --cov-fail-under=90
      - run: python -m build
      - run: python scripts/verify_source_locked_holdout.py
      - run: PYTHONPATH=src python scripts/verify_measured_multiservice_v1.py
      - run: >-
          python scripts/verify_formal_conformance.py
          --expected formal/conformance-v1.json
          --output /tmp/formal-conformance.json
      - run: python experiments/run_pcug_mechanism_stress.py --output /tmp/pcug-stress.json
      - run: >-
          python external_evaluator/run.py
          --sources benchmark/external-sources-v1.json
          --output /tmp/erasemap-external-evaluator
      - run: >-
          python external_evaluator/verify.py
          /tmp/erasemap-external-evaluator/evaluation-records.json
      - run: >-
          erasemap pcug benchmark development
          --protocol benchmark/pcug-protocol-v1.json
          --output /tmp/erasemap-pcug-development
      - run: >-
          erasemap pcug verify-directory
          /tmp/erasemap-pcug-development/bundles
          --public-key /tmp/erasemap-pcug-development/public-key.pem

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: true
          nanoda: true
          nanoda-allow-sorry: false
