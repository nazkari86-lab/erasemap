name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,real]'
      - run: python -m ruff check .
      - run: python -m mypy src/erasemap
      - run: python -m pytest --cov=erasemap --cov-report=term-missing --cov-fail-under=90
      - run: python -m build
      - run: >-
          erasemap pcug benchmark development
          --protocol benchmark/pcug-protocol-v1.json
          --output /tmp/erasemap-pcug-development
      - run: >-
          erasemap pcug verify-directory
          /tmp/erasemap-pcug-development/bundles
          --public-key /tmp/erasemap-pcug-development/public-key.pem
