[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "erasemap"
version = "0.3.0"
description = "Typed residual-path auditing for controlled biometric data erasure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
]
real = ["joblib>=1.4", "numpy>=1.24,<2.5", "scikit-learn>=1.5,<1.9"]
face = [
  "joblib>=1.4",
  "huggingface-hub>=0.34",
  "matplotlib>=3.9",
  "numpy>=1.24,<2.5",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "scikit-learn>=1.5,<1.9",
  "torch>=2.5",
  "torchvision>=0.20",
]

[project.scripts]
erasemap = "erasemap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/erasemap"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["erasemap"]
