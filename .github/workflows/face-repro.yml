name: face-repro

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: face-repro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trainable-pixel-backbone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci-py311.txt
      - run: python -m pip install --constraint constraints/ci-py311.txt -e '.[dev,face]'
      - run: python -m ruff check experiments/trainable_pixel_backbone.py
      - name: Run frozen end-to-end pixel-backbone benchmark
        run: >-
          python experiments/trainable_pixel_backbone.py
          --download
          --output outputs/trainable-pixel-backbone-v1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trainable-pixel-backbone-v1
          path: outputs/trainable-pixel-backbone-v1/result.json
          if-no-files-found: error
          retention-days: 30
