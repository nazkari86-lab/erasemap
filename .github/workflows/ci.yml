name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci-py311.txt
      - run: >-
          python -m pip install
          --constraint constraints/ci-py311.txt
          -e '.[dev,real]'
      - run: python scripts/verify_ci_environment.py --constraints constraints/ci-py311.txt
      - run: python -m ruff check .
      - run: >-
          python -m mypy --strict
          src pilot external_challenge external_temporal_challenge external_transfer
          external_ghostgraph_challenge usability
      - run: >-
          python -m pytest
          --cov=erasemap --cov=external_challenge --cov=external_temporal_challenge --cov=pilot
          --cov-report=term-missing --cov-fail-under=90
      - run: python -m build
      - run: python scripts/verify_source_locked_holdout.py
      - run: python scripts/verify_external_freeze.py
      - run: python scripts/verify_sequential_deletion_privacy_v1.py
      - run: python scripts/verify_qwen_tofu_kaggle_v1.py
      - run: PYTHONPATH=src:. python scripts/verify_qwen_tofu_kaggle_v2.py
      - run: python scripts/verify_open_transfer_v1.py
      - run: python -m usability.verify
      - run: PYTHONPATH=src python scripts/verify_measured_multiservice_v1.py
      - run: python scripts/verify_regeneration_safe_erasure_v1.py
      - run: >-
          PYTHONPATH=src python experiments/run_regeneration_safe_erasure_v1.py
          --output /tmp/erasemap-rse-v1
      - run: >-
          python scripts/verify_regeneration_safe_erasure_v1.py
          --result /tmp/erasemap-rse-v1/result.json
      - run: python scripts/verify_regeneration_safe_erasure_v2.py
      - run: >-
          PYTHONPATH=src python experiments/run_regeneration_safe_erasure_v2.py
          --output /tmp/erasemap-rse-v2
      - run: >-
          python scripts/verify_regeneration_safe_erasure_v2.py
          --result /tmp/erasemap-rse-v2/result.json
      - run: python scripts/verify_topology_robust_erasure_v1.py
      - run: >-
          PYTHONPATH=src python experiments/run_topology_robust_erasure_v1.py
          --output /tmp/erasemap-tre-v1
      - run: >-
          python scripts/verify_topology_robust_erasure_v1.py
          --result /tmp/erasemap-tre-v1/result.json
      - run: python scripts/verify_erasure_tomography_v1.py
      - run: >-
          PYTHONPATH=src:. python experiments/run_erasure_tomography_v1.py
          --protocol benchmark/erasure-tomography-v1.json
          --reveal benchmark/erasure-tomography-v1-reveal.json
          --output /tmp/erasemap-et-v1
      - run: >-
          PYTHONPATH=src:. python scripts/verify_erasure_tomography_v1.py
          --result /tmp/erasemap-et-v1/result.json
      - run: python scripts/verify_erasure_tomography_redis_v1.py
      - run: PYTHONPATH=src:. python scripts/verify_ghostgraph_v1.py
      - run: >-
          PYTHONPATH=src:. python experiments/run_ghostgraph_v1.py
          --protocol benchmark/ghostgraph-v1.json
          --reveal benchmark/ghostgraph-v1-reveal.json
          --output /tmp/erasemap-ghostgraph-v1
      - run: >-
          PYTHONPATH=src:. python scripts/verify_ghostgraph_v1.py
          --output /tmp/erasemap-ghostgraph-v1
      - run: PYTHONPATH=src:. python scripts/verify_ghostgraph_v2.py
      - run: PYTHONPATH=src:. python scripts/verify_ghostgraph_live_v2.py
      - run: PYTHONPATH=src:. python scripts/verify_ghostgraph_t_v1.py
      - run: >-
          PYTHONPATH=src:. python experiments/run_ghostgraph_t_v1.py
          --output /tmp/erasemap-ghostgraph-t-v1
      - run: >-
          PYTHONPATH=src:. python scripts/verify_ghostgraph_t_v1.py
          --result /tmp/erasemap-ghostgraph-t-v1/result.json
      - run: python -m external_ghostgraph_challenge.verify
      - run: python -m external_ghostgraph_challenge.verify_v2 --help
      - run: >-
          python scripts/verify_formal_conformance.py
          --expected formal/conformance-v1.json
          --output /tmp/formal-conformance.json
      - run: >-
          python scripts/verify_rse_conformance.py
          --expected formal/rse-msc-conformance-v1.json
          --output /tmp/rse-msc-conformance.json
      - run: >-
          python scripts/verify_tre_conformance.py
          --expected formal/tre-conformance-v1.json
          --output /tmp/tre-conformance.json
      - run: >-
          PYTHONPATH=src python scripts/verify_erasure_tomography_conformance.py
          --expected formal/erasure-tomography-conformance-v1.json
          --output /tmp/erasure-tomography-conformance.json
      - run: >-
          PYTHONPATH=src python scripts/verify_ghostgraph_conformance.py
          --expected formal/ghostgraph-conformance-v1.json
          --output /tmp/ghostgraph-conformance.json
      - run: python experiments/run_pcug_mechanism_stress.py --output /tmp/pcug-stress.json
      - run: >-
          python external_evaluator/run.py
          --sources benchmark/external-sources-v1.json
          --output /tmp/erasemap-external-evaluator
      - run: >-
          python external_evaluator/verify.py
          /tmp/erasemap-external-evaluator/evaluation-records.json
      - run: >-
          erasemap pcug benchmark development
          --protocol benchmark/pcug-protocol-v1.json
          --output /tmp/erasemap-pcug-development
      - run: >-
          erasemap pcug verify-directory
          /tmp/erasemap-pcug-development/bundles
          --public-key /tmp/erasemap-pcug-development/public-key.pem

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Pinned after v1.5.0 so the declared axiom-audit input is actually executed.
      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          build: true
          build-args: "--wfail"
          leanchecker: true
          axiom-audit: true
          axiom-audit-root: EraseMapFormal
