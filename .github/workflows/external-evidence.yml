name: external-evidence

on:
  pull_request:
    paths:
      - "external_results/*/manifest.json"

permissions:
  contents: read

jobs:
  verify-external-submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci-py311.txt
      - run: python -m pip install --constraint constraints/ci-py311.txt -e .
      - run: python scripts/verify_external_registry.py --root external_results
