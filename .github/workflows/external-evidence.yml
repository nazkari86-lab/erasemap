name: external-evidence

on:
  pull_request:
    paths:
      - "external_results/*/manifest.json"

permissions:
  contents: read

jobs:
  verify-external-submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/verify_external_registry.py --root external_results
